# RTL-SDR configuration. The header entry defines
# that this device uses librtlsdr. The values all
# correspond to what rtl_sdr / rtl_test use. Key/value
# pairs are processed in order as they appear in the file.
[rtlsdr]

# Optional: select a device by its exact serial string. If no exact match is
# found, a positive decimal value also matches a zero-padded decimal serial.
# serial = 00000001

# Center frequency in Hz (default: 1090 MHz for ADS-B)
frequency = 1090000000

# Gain in dB. If AGC is enabled, this value is ignored.
# gain = 40
agc = true

# Enable or disable the 5V bias tee (if supported)
bias_tee = false

# Optional: frequency correction in PPM
# ppm = 0

# Tuner bandwidth in Hz. For common R820T/R820T2 receivers at the commonly used
# 2.4 and 2.56 Msps rates, 3000000 selects the 6 MHz IF filter state. Pinning
# it avoids backend-dependent automatic selection; paired tests at 2.4 Msps
# found this state better than the narrower 2.43 MHz state. Other tuner types
# or sample rates may need a different value.
tuner_bandwidth = 3000000

# ------------------------------------------------------------------
# 3.2 Msps preset. Run as: stream1090 -s 3.2 -u 24 -q -d <this ini>
# The narrow tuner state is REQUIRED: at 3.2 the auto state is the
# 6 MHz TV filter, whose noise aliases across Nyquist (1.6 MHz) and
# costs ~15% of frames. Build with -DENABLE_RTLSDR_BLOG=ON: the system
# librtlsdr maps the same settings to different tuner states and the
# preset loses ~35% frames (stream1090 warns at startup).
# [rtlsdr]
# frequency = 1090000000
# agc = false
# gain = 49.6
# tuner_bandwidth = 2430000
# bias_tee = false
# ------------------------------------------------------------------

