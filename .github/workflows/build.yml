name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build the way a user would, with both device backends present, and run
  # the test suite. Tests are opt-in in CMakeLists.txt, so -DBUILD_TESTING=ON
  # is required or ctest silently finds nothing to run.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libairspy-dev librtlsdr-dev

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Build against the vendored RTL-SDR Blog fork instead of the system
  # librtlsdr. It is a different library: the per-stage tuner gain entry points
  # only exist there, and the code behind STREAM1090_HAVE_RTLSDR_BLOG is
  # compiled in no other job, so it can rot without anyone noticing.
  # librtlsdr-dev is deliberately not installed here, which also checks that
  # the vendored build needs nothing from the system one.
  build-vendored-rtlsdr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libusb-1.0-0-dev libairspy-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DENABLE_RTLSDR_BLOG=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The device backends are optional: CMakeLists.txt drops each one when its
  # library is missing. Nothing else builds that configuration, so it is easy
  # to break without noticing.
  build-without-device-backends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # macOS with Apple Clang, and warnings fatal. Two things nothing else covers:
  # Apple Clang is a different compiler from the gcc and Clang the Ubuntu jobs
  # run, with a different warning set and a different standard library, and no
  # job builds on macOS at all. -Werror is set here rather than in
  # CMakeLists.txt so a warning fails the pipeline without failing the build
  # for anyone compiling by hand.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install pkg-config libusb airspy librtlsdr

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
